[project]
name = "company-pipeline"
version = "0.1.0"
description = "D&B company data (JSON) -> validated, linked tables -> Parquet"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.6",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["company_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
